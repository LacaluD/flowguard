[project]
dependencies = [
    "jsonschema>=4.0",
    "loguru>=0.7.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "coverage", "ruff", "black", "mypy", "bandit", "safety", "attrs", "python-dotenv", "pip-tools"]

[tool.ruff.lint]
select = ["TID252"]  # Forbids relative imports

[tool.coverage.run]
source = ["src", "main"]
omit = [
    "tests/*",
    "*/site-packages/*",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true