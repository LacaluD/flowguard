name: Security Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


jobs:
  tests:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    steps:
      - uses: actions/checkout@v6.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install git
        run: |
          apt-get update
          apt-get install -y git curl gpg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pytest pytest-mock coverage PyYAML jsonschema loguru

      - name: Run tests
        run: |
          mkdir -p docs
          python -m coverage run -m pytest -v -c configs/pytest.ini
          python -m coverage xml -o coverage.xml
          python -m coverage json -o coverage.json
          python -m coverage report | tee docs/coverage-report.txt
        shell: bash
        continue-on-error: false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Upload Coverage report artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: coverage-report
          path: |
            docs/coverage-report.txt
            coverage.json
            coverage.xml


  security-audit:
    needs: tests
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir bandit safety

      - name: Run Safety security checks
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: |
          mkdir -p docs
          set -o pipefail
          safety scan --full-report --text --non-interactive \
          --disable-telemetry | tee docs/safety-report.txt
        shell: bash
        continue-on-error: false

      - name: Upload Safety report artifact
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: safety-report
          path: docs/safety-report.txt

      - name: Run Bandit security linter
        run: |
          mkdir -p docs
          set -o pipefail
          bandit -c configs/bandit.yml -r . -f txt \
          --severity-level high --confidence-level high \
          | tee docs/bandit-report.txt
        shell: bash
        continue-on-error: false

      - name: Upload Bandit report artifact
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: bandit-report
          path: docs/bandit-report.txt


  typecheck:
    needs: security-audit
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir mypy

      - name: Run mypy type checks
        run: |
          mkdir -p docs
          set -o pipefail
          mypy . --config-file configs/mypy.ini -v 2>docs/mypy-report-verbose.txt | tee docs/mypy-report.txt

          printf '\nChecked files by mypy:\n'
          sed -n "s/.*BuildSource(path='\([^']*\)'.*/\1/p" docs/mypy-report-verbose.txt \
          | sort -u | tee docs/mypy-files.txt
        shell: bash

      - name: Upload mypy report artifact
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: mypy-report
          path: docs/mypy-report.txt


  formatting:
    needs: typecheck
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    steps:
      - uses: actions/checkout@v6.0.0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir ruff black

      - name: Run code formatting checks
        shell: bash
        run: |
          ruff check .
          black --check .

  notify:
    needs: [tests, security-audit, typecheck, formatting]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all reports artifact
        if: ${{ contains(needs.*.result, 'failure') }}
        uses: actions/download-artifact@v8.0.0
        with:
          name: all-reports
          path: ./reports
        continue-on-error: true

      - name: Zip reports
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          if ls reports/* 1> /dev/null 2>&1; then
            zip -j reports/all-reports.zip reports/*.txt reports/*.json reports/*.xml
          fi
        continue-on-error: true

      - name: Send success telegram message
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        uses: cbrgm/telegram-github-action@v1.4.0
        with:
          token: ${{ secrets.TG_BOT_TOKEN }}
          to: ${{ secrets.TG_CHAT_ID }}
          disable-web-page-preview: true
          message: |
            **Rep. Name:** [${{ github.repository }}](${{ github.server_url }}/${{ github.repository }})

            Branch: `${{ github.ref_name }}`
            Commit: [${{ github.event.head_commit.message }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            Author Name: ${{ github.actor }}

            ✅ Security checks have completed successfully!

      - name: Check if reports exist
        id: check_reports
        run: |
          if [ -f "./reports/all-reports.zip" ]; then
            echo "has_reports=true" >> $GITHUB_OUTPUT
          else
            echo "has_reports=false" >> $GITHUB_OUTPUT
          fi

      - name: Send failure telegram message with reports
        if: ${{ contains(needs.*.result, 'failure') && steps.check_reports.outputs.has_reports == 'true' }}
        uses: cbrgm/telegram-github-action@v1.4.0
        with:
          token: ${{ secrets.TG_BOT_TOKEN }}
          to: ${{ secrets.TG_CHAT_ID }}
          media: ./reports/all-reports.zip
          media-type: document
          disable-web-page-preview: true
          message: |
            **Rep. Name:** [${{ github.repository }}](${{ github.server_url }}/${{ github.repository }})

            Branch: `${{ github.ref_name }}`
            Commit: [${{ github.event.head_commit.message }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            Author Name: ${{ github.actor }}

            ❌ Security checks have failed!

      - name: Send failure telegram message without reports
        if: ${{ contains(needs.*.result, 'failure') && steps.check_reports.outputs.has_reports == 'false' }}
        uses: cbrgm/telegram-github-action@v1.4.0
        with:
          token: ${{ secrets.TG_BOT_TOKEN }}
          to: ${{ secrets.TG_CHAT_ID }}
          media: ./reports/all-reports.zip
          media-type: document
          disable-web-page-preview: true
          message: |
            **Rep. Name:** [${{ github.repository }}](${{ github.server_url }}/${{ github.repository }})

            Branch: `${{ github.ref_name }}`
            Commit: [${{ github.event.head_commit.message }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            Author Name: ${{ github.actor }}

            ❌ Security checks have failed!
