name: Security Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


jobs:
  tests:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pytest coverage

      - name: Run tests
        run: |
          mkdir -p docs
          python -m coverage run -m pytest -q -c configs/pytest.ini
          python -m coverage xml -o coverage.xml
          python -m coverage json -o coverage.json
          python -m coverage report | tee docs/coverage-report.txt
        shell: bash
        continue-on-error: false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Upload Coverage report artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            docs/coverage-report.txt
            coverage.json
            coverage.xml


  security-audit:
    needs: tests
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir bandit safety

      - name: Run Safety security checks
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: |
          mkdir -p docs
          safety scan --full-report --text --non-interactive \
          --disable-telemetry --disable-policy-fetch --exit-zero \
          | tee docs/safety-report.txt
        shell: bash
        continue-on-error: false

      - name: Upload Safety report artifact
        uses: actions/upload-artifact@v7
        with:
          name: safety-report
          path: docs/safety-report.txt

      - name: Run Bandit security linter
        run: |
          mkdir -p docs
          bandit -c configs/bandit.yml -r . -f txt -o docs/bandit-report.txt || true
        shell: bash
        continue-on-error: false

      - name: Upload Bandit report artifact
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: docs/bandit-report.txt


  typecheck:
    needs: security-audit
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir mypy

      - name: Run mypy type checks
        run: |
          mkdir -p docs
          mypy . --config-file configs/mypy.ini > docs/mypy-report.txt || true
        shell: bash
        continue-on-error: false

      - name: Upload mypy report artifact
        uses: actions/upload-artifact@v7
        with:
          name: mypy-report
          path: docs/mypy-report.txt


  formatting:
    needs: typecheck
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    permissions:
      contents: write
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git

      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          ref: main
          fetch-depth: 0

      - name: Trust repo for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Sync with origin/main
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir ruff black

      - name: Run code formatting checks
        run: |
          ruff check .
          if ! black --check .; then
            echo "Code formatting issues found. Running 'black .' to fix them."
            black .
          fi
        shell: bash

      - name: Push formatting changes if any
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Apply code formatting [skip ci]"
            git push origin main
          else
            echo "No formatting changes to commit."
          fi


  versioning:
    needs: formatting
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    permissions:
      contents: write
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git

      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          ref: main
          fetch-depth: 0

      - name: Trust repo for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Sync with origin/main
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Generate build number and commit
        run: |
          BUILD_NUMBER=${GITHUB_RUN_NUMBER}
          COMMIT_SHA=$(git rev-parse --short HEAD)

          echo "Build: $BUILD_NUMBER"
          echo "Commit: $COMMIT_SHA"

      - name: Write version.py
        run: |
          VERSION=$(python -c "from version import __version__; print(__version__)")
          BUILD_NUMBER=${GITHUB_RUN_NUMBER}
          COMMIT_SHA=$(git rev-parse --short HEAD)

          echo "__version__ = '$VERSION'" > version.py
          echo "__build__ = '$BUILD_NUMBER'" >> version.py
          echo "__commit__ = '$COMMIT_SHA'" >> version.py

      - name: Push version.py if changed
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION=$(python -c "from version import __version__; print(__version__)")
          BUILD_NUMBER=${GITHUB_RUN_NUMBER}
          COMMIT_SHA=$(git rev-parse --short HEAD)

          echo "__version__ = '$VERSION'" > version.py
          echo "__build__ = '$BUILD_NUMBER'" >> version.py
          echo "__commit__ = '$COMMIT_SHA'" >> version.py

          git add version.py
          if ! git diff --cached --quiet; then
            git commit -m "Update version.py [skip ci]"
            git push origin main
          else
            echo "No version changes to commit."
          fi


      - name: Send telegram message
        if: always()
        uses: cbrgm/telegram-github-action@v1
        with:
          token: ${{ secrets.TG_BOT_TOKEN }}
          to: ${{ secrets.TG_CHAT_ID }}
          disable-web-page-preview: true
          message: |
            **Rep. Name:** [${{ github.repository }}](${{ github.server_url }}/${{ github.repository }})

            Branch: `${{ github.ref_name }}`
            Commit: [${{ github.event.head_commit.message }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            Author Name: ${{ github.actor }}

            Security checks have completed!
