name: demo-pipeline-v2
"on":
  push:
    branches:
      - main
      - develop        # added
  workflow_dispatch:
    inputs:
      deploy_env:
        description: "Deployment target"
        required: true
        default: production  # changed: previously staging
        type: choice
        options:
          - staging
          - production
          - canary           # added

env:
  APP_NAME: YMLValidator
  PYTHONUNBUFFERED: "1"
  LOG_LEVEL: debug           # added

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5       # changed: previously 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v6  # changed: previously v5
      - name: Run linter
        run: echo "lint ok"

  test:
    runs-on:
      - ubuntu-latest
    needs: lint
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # changed: previously 3.12
      - name: Run tests
        run: echo "tests ok"
      - name: Upload coverage  # added
        run: echo "coverage ok"

  # deploy removed