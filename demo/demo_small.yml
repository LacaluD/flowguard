name: demo-pipeline

"on":
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_env:
        description: "Deployment target"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

env:
  APP_NAME: YMLValidator
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Run linter
        run: echo "lint ok"

  test:
    runs-on:
      - ubuntu-latest
    needs: lint
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: echo "tests ok"

  deploy:
    runs-on: ubuntu-latest
    needs:
      - test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy
        shell: bash
        run: echo "deploy ok"
