name = "data-pipeline"

[jobs.extract]
runs-on = "ubuntu-latest"

[[jobs.extract.steps]]
name = "Pull data"
run = "python extract.py"

[jobs.validate]
runs-on = "ubuntu-latest"
needs = "extract"

[[jobs.validate.steps]]
name = "Validate schema"
run = "python validate.py"

[jobs.transform]
runs-on = "ubuntu-latest"
needs = ["extract", "validate"]

[[jobs.transform.steps]]
name = "Transform"
run = "python transform.py"

[[jobs.transform.steps]]
name = "Enrich data"
run = "python enrich.py"

[jobs.load]
runs-on = "ubuntu-latest"
needs = "transform"

[[jobs.load.steps]]
name = "Load to DB"
run = "python load.py"